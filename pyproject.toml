[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ollabench"
version = "0.1.0"
description = "Fleet-wide inference benchmarking for Ollama — find which node runs which model fastest"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Brais Revalderia", email = "orevalderia@gmail.com" }]
keywords = ["ollama", "llm", "benchmark", "inference", "fleet", "performance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Topic :: System :: Benchmark",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
ollabench = "ollabench.cli:main"

[tool.setuptools.packages.find]
include = ["ollabench*"]
